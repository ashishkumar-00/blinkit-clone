<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Zomato Clone</title>
</head>
<body>
    <div class="container">

        <header class="header-1">
            <div class="logo">
                <h1 class="logo-zomato">zomato</h1>
            </div>

            <div class="search-container">
                <form action="/search_results.html" method="get" class="search-form">
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="search" id="site-search" placeholder="Search for restaurant, cuisine or a dish">
                    </div>
                </form>
            </div>

            <div class="auth-buttons">
                <button class="login-btn btn">Log in</button>
                <button class="signup-btn btn">Sign up</button>
            </div>
        </header>
    </div>

    <!-- text bar --> 

    <div class="contenear-2">
        <p>Home / India / Roorkee Restaurants</p>

        <div class="filters-tag">
            <div class="Filters btan">Filters</div>
             <div class="Pure Veg btan">Pure Veg</div>
             <div class="Cuisines btan">Cuisines</div>
        </div>
    </div>

   <section class="food-box">
      <p class="food-tex">Inspiration for your first order</p>

      <div class="food-img">
        <div class="img-1 img"></div>
        <div class="img-2 img"></div>
        <div class="img-3 img"></div>
        <div class="img-4 img"></div>
        <div class="img-5 img"></div>
        <div class="img-6 img"></div>
      </div>
   </section>
</body>
</html>
